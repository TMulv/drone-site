<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tyler Mulvey · Aerial 360</title>
<meta name="description" content="Drone 360° panoramas by Tyler Mulvey. Browse by town, state, year, or season, then step inside any one full screen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>
<div class="grain" aria-hidden="true"></div>

<header>
  <div class="mark">Tyler Mulvey<span>aerial 360 · dji mini 4k</span></div>
  <div class="compass" id="compassWrap" aria-hidden="true" hidden>
    <div class="tape" id="tape"></div>
    <div class="hdg"><span id="hdg">000</span>°</div>
  </div>
  <nav class="controls" id="browseControls">
    <div class="search">
      <input id="search" type="text" placeholder="search town, state, year, season" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <span id="searchCount" aria-live="polite"></span>
      <button id="searchClear" class="clear" type="button" hidden aria-label="clear search">&times;</button>
    </div>
  </nav>
  <nav class="controls" id="viewerControls" hidden>
    <div class="zoom">
      <button id="zoomOut" class="pill" type="button" aria-label="zoom out">&minus;</button>
      <button id="zoomIn" class="pill" type="button" aria-label="zoom in">+</button>
    </div>
    <button id="spin" class="pill" aria-pressed="false"><span class="wide">auto </span>spin</button>
    <button id="words" class="pill" type="button">show text</button>
    <button id="fs" class="pill" type="button" aria-label="full screen" hidden>
      <span class="lbl">full screen</span>
      <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
    </button>
  </nav>
</header>

<main id="browse">
  <section class="list">
    <div class="sortbar" role="group" aria-label="sort">
      <span class="sortLabel">sort</span>
      <button class="sort" type="button" data-sort="date">date</button>
      <button class="sort" type="button" data-sort="city">city</button>
      <button class="sort" type="button" data-sort="state">state</button>
      <button class="dir" id="sortDir" type="button" aria-label="reverse sort order"></button>
    </div>
    <ul id="entries"></ul>
  </section>
  <aside class="detail" id="detail">
    <button class="photo" id="detailPhoto" type="button">
      <img id="detailImg" alt="">
      <span class="photoHint">step inside</span>
    </button>
    <div class="detailText">
      <h2 id="detailTitle">&nbsp;</h2>
      <div class="meta" id="detailMeta"></div>
      <div class="facts" id="detailFacts"></div>
    </div>
    <div id="map" class="map" aria-label="map of where the 360s were shot"></div>
  </aside>
</main>

<div id="viewer" hidden>
  <button id="back" class="back" hidden>← back<span class="wide"> to the list</span></button>
  <footer id="caption" aria-live="polite">
    <div class="count">no. <span id="idx">01</span><i></i><span id="total">20</span></div>
    <h1 id="title">&nbsp;</h1>
    <div class="meta" id="meta">&nbsp;</div>
    <div class="hint" id="hint">drag to look around · scroll to zoom · esc to leave</div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js" } }
</script>
<script type="module" src="script.js"></script>
</body>
</html>
